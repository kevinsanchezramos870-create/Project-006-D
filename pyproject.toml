[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project006"
version = "2.0.0"
description = "Project 006-D: 0.5 lb payload quadcopter, G-code grid flight, vision swarm and failsafes for ArduPilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pymavlink>=2.4.41"]

[project.optional-dependencies]
# On the Pi use apt's python3-opencv + python3-picamera2 instead (faster, prebuilt).
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]
dev = ["pytest>=8", "opencv-python-headless>=4.8", "numpy>=1.24"]

[project.scripts]
p006-sizing = "project006.sizing:main"
p006-grid = "project006.grid_commander:main"
p006-vision = "project006.vision:main"
p006-swarm = "project006.swarm:main"
p006-emergency = "project006.emergency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
