# /etc/mavlink-router/main.conf on each drone's Raspberry Pi Zero 2 W.
# One process owns the flight-controller serial port and shares it with
# every program, so the vision tracker, the guard and your ground station can
# all talk to the drone at the same time (the 3-lb draft had them fight over
# one UDP port).

[General]
# Onboard scripts connect with  tcp:127.0.0.1:5760  (many clients allowed)
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = ardupilotmega

[UartEndpoint flightcontroller]
Device = /dev/serial0
Baud = 921600

# Ground station / swarm coordinator. Use a different port per drone:
# drone 1 -> 14551, drone 2 -> 14552, drone 3 -> 14553 (matches drone.toml).
[UdpEndpoint groundstation]
Mode = Normal
Address = 192.168.1.100
Port = 14551

# QGroundControl / Mission Planner just watching (optional)
[UdpEndpoint qgc]
Mode = Normal
Address = 192.168.1.100
Port = 14550
